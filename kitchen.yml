# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  cgroupns_mode: private
  run_command: /usr/lib/systemd/systemd
  provision_command:
    # Workaround for RHEL-based images: SSSD is configured (via authselect) but
    # not running in containers, and /etc/shadow has 000 permissions which blocks
    # unix_chkpwd (it drops DAC_OVERRIDE). This breaks SSH and sudo for `kitchen`.
    - >-
      if [ -f /etc/nsswitch.conf ]; then
      sed -i '/^passwd:/s/sss //;/^group:/s/sss //' /etc/nsswitch.conf;
      fi
    - chmod 0640 /etc/shadow 2>/dev/null; true

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: kubeadm
  salt_copy_filter:
    - .kitchen
    - .git
  pillars_from_directories:
    - test/salt/pillar
  cache_commands:
    # Download k8s binaries to a persistent host-side cache (skips if present).
    - >-
      mkdir -p .kitchen/cache/k8s/v1.25.16/bin/linux/amd64 &&
      cd .kitchen/cache/k8s/v1.25.16/bin/linux/amd64 &&
      k8s_base=https://dl.k8s.io/release/v1.25.16/bin/linux/amd64;
      for f in kubeadm kubelet kubectl; do
        test -f "$f" || curl -fsSL -o "$f" "$k8s_base/$f";
        test -f "$f.sha256" || curl -fsSL -o "$f.sha256" "$k8s_base/$f.sha256";
      done
    # Copy cached binaries into the sandbox so they are available as salt:// files.
    - >-
      mkdir -p %{sandbox_path}/srv/salt/cache/k8s/v1.25.16/bin/linux/amd64 &&
      cp .kitchen/cache/k8s/v1.25.16/bin/linux/amd64/*
      %{sandbox_path}/srv/salt/cache/k8s/v1.25.16/bin/linux/amd64/

transport:
  name: docker

platforms:
  ## SALT `3008.5`
  - name: debian-13-3008-5
    driver:
      dockerfile: test/docker/bootstrap/Dockerfile
      build_context: true
      run_command: /lib/systemd/systemd
      volume:
        # Persist containerd image cache between kitchen runs.
        - >-
          <%= File.expand_path('.kitchen/cache/containerd', __dir__) %>:/var/lib/containerd


verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli
    - junit:.kitchen/reports/%{suite}-%{platform}.xml


suites:
  - name: default
    provisioner:
      state_top:
        base:
          '*':
            - kubeadm._mapdata
            - kubeadm
    verifier:
      inspec_tests:
        - path: test/integration/default

  - name: bootstrap
    provisioner:
      # Copy the repository as a file root so master-side orch/ and _runners/
      # are available in addition to the node formula.
      formula: null
      is_file_root: true
      dependencies:
        - name: containerd
          repo: git
          source: https://github.com/SomeBlackMagic/salt-containerd-formula.git
          branch: master
      salt_minion_extra_config:
        file_roots:
          base:
            - /tmp/kitchen/srv/salt
            - /usr/share/salt-formulas/env/_formulas/containerd
      pillars_from_directories:
        - test/salt/pillar
      state_top:
        base:
          '*':
            - test.fixtures.states.bootstrap
    verifier:
      inspec_tests:
        - path: test/integration/bootstrap
